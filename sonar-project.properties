# SonarCloud configuration for jh125486/pdf2qti.
sonar.projectKey=jh125486_pdf2qti
sonar.organization=jh125486

# Go coverage: matches test.yaml's "Run tests" step (make test), which
# writes coverage.txt via `go tool -modfile=tools/go.mod gotestsum --
# -race -shuffle=on -coverprofile=coverage.txt ./...`. SonarCloud's Go
# analyzer reads the standard `go test` cover-profile format directly, no
# conversion step needed.
sonar.go.coverage.reportPaths=coverage.txt

# Without this, SonarCloud counts every *_test.go file itself as source
# needing coverage. That's not a real gap: `go test`'s own coverage profile
# only ever instruments non-test source (a test file is the thing doing the
# covering, not a thing that gets covered), so those files were never going
# to appear in coverage.txt with anything but 0% — counting them anyway
# drags the whole-project percentage down by a non-representative margin.
sonar.coverage.exclusions=**/*_test.go
