name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # SONAR_TOKEN is exposed at job level, not just the SonarCloud step's own
    # env:, so the step's `if:` guard below can read it as `env.SONAR_TOKEN`
    # -- the `secrets` context isn't valid inside a step/job `if:` at all;
    # referencing secrets.SONAR_TOKEN there fails the whole workflow at
    # parse time.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud's scan reads git blame/history for new-code-period
          # analysis, which a shallow clone can't answer.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Run static checks
        run: make static

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: SonarQube Cloud Scan
        # SonarSource/sonarcloud-github-action is deprecated -- confirmed
        # directly from this workflow's own earlier run, which already
        # showed the action internally delegating to
        # __SonarSource_sonarqube-scan-action. Swapped to the documented
        # drop-in replacement: same SONAR_TOKEN/GITHUB_TOKEN env vars, no
        # other changes needed.
        #
        # Guarded on the secret's presence so this step is a no-op -- not a
        # broken CI run -- until SONAR_TOKEN exists as a repo secret. Reads
        # coverage.txt directly via sonar.go.coverage.reportPaths (see
        # sonar-project.properties), so this must run after the tests step
        # above, not standalone.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
