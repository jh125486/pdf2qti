name: Mutation badges

# Mutation-tests the packages that hold pdf2qti's actual conversion/parsing
# logic — everything except internal/itembank, which drives a real Chrome
# instance over CDP and whose correctness depends on live Canvas UI/autosave
# behavior mutation testing can't meaningfully exercise (see its own test
# suite's mocked chromedp `run` field for why: a mutant there mostly proves
# the mock, not the browser interaction).
#
# A full sweep against every package is slow enough that this runs on a
# schedule/manual dispatch, never per-push or per-PR — same reasoning as
# turango's own dogfooding workflow (github.com/jh125486/turango
# .github/workflows/mutation-badge.yml), which this file is adapted from.
#
# The sweep is sharded across a job matrix (below) purely to cut wall-clock
# time by running shards on separate runners concurrently. Each shard still
# runs turango with the default -mutatescope=full, i.e. still reruns the
# *whole module's* `go test ./...` per mutant — sharding only changes which
# runner classifies which mutant, not how a mutant is classified, so the
# aggregate score is the same as a single-job run would produce.
on:
  schedule:
    # Weekly. The mutation score changes only when source or tests change,
    # not on a fixed cadence, but a calendar trigger is the simplest way to
    # keep the published badge from silently going stale if nobody happens
    # to run this manually for a while.
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  mutation-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Package groups sized to balance wall-clock per shard, not package
        # count — cmd/... and internal/qti/... are large/slow packages so
        # each gets its own shard rather than being bundled with others.
        include:
          - name: cmd-config-page
            packages: ./cmd/... ./internal/config/... ./internal/page/...
          - name: qti
            packages: ./internal/qti/...
          - name: audit-canvas-distill-extract
            packages: ./internal/audit/... ./internal/canvas/... ./internal/distill/... ./internal/extract/...
          - name: generate-merge-openai-pptx-render-validate
            packages: >-
              ./internal/generate/... ./internal/merge/... ./internal/openai/...
              ./internal/pptx/... ./internal/render/... ./internal/validate/...
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install turango
        run: go install github.com/jh125486/turango/cmd/turango@latest

      # Verdicts are cached across scheduled runs, keyed on the hash of
      # every source/test file in the repo (a mutant classification under
      # -mutatescope=full can depend on any package's tests, not just the
      # mutated one, so the cache key can't be narrowed to this shard's
      # packages) plus the shard name, so shards never share or clobber
      # each other's cache entries.
      - name: Restore mutation verdict cache
        uses: actions/cache@v6
        with:
          path: mutation-cache
          key: mutation-cache-${{ matrix.name }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: |
            mutation-cache-${{ matrix.name }}-

      - name: Run turango against this shard's packages
        run: |
          mkdir -p mutation-report mutation-cache
          turango test -mutate=. \
            -mutateoutput=mutation-report \
            -mutatecache=mutation-cache \
            ${{ matrix.packages }}

      - name: Upload shard report
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: mutation-report/mutate-report.json

  publish-badges:
    needs: mutation-shard
    runs-on: ubuntu-latest
    # contents:write is required to push the generated badge JSON to
    # gh-pages via peaceiris/actions-gh-pages; cannot be downgraded to read.
    permissions:
      contents: write
    steps:
      - name: Download all shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-*
          path: mutation-reports
          merge-multiple: false

      - name: Merge shard reports and compute mutation metrics
        id: score
        run: |
          reports=$(find mutation-reports -name mutate-report.json)
          mutants=$(jq -s '[.[].Mutants[]] | length' $reports)
          killed=$(jq -s '[.[].Mutants[] | select(.Status=="killed")] | length' $reports)
          survived=$(jq -s '[.[].Mutants[] | select(.Status=="survived")] | length' $reports)
          viable=$((killed + survived))

          if [ "$viable" -eq 0 ]; then
            pct="0.0"
          else
            pct=$(awk -v k="$killed" -v v="$viable" 'BEGIN { printf "%.1f", (k / v) * 100 }')
          fi

          # shields.io endpoint-schema color thresholds: red below 50%,
          # yellow from 50% up to (not including) 80%, green at 80%+.
          color=$(awk -v p="$pct" 'BEGIN {
            if (p + 0 >= 80) print "brightgreen";
            else if (p + 0 >= 50) print "yellow";
            else print "red";
          }')

          echo "mutants=$mutants" >> "$GITHUB_OUTPUT"
          echo "killed=$killed" >> "$GITHUB_OUTPUT"
          echo "survived=$survived" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Write shields.io endpoint JSON files
        run: |
          mkdir -p badges
          cat > badges/mutation-score.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutation score",
            "message": "${{ steps.score.outputs.pct }}%",
            "color": "${{ steps.score.outputs.color }}"
          }
          EOF

          cat > badges/mutants-count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutants",
            "message": "${{ steps.score.outputs.mutants }}",
            "color": "blue"
          }
          EOF

      - name: Publish to gh-pages
        # peaceiris/actions-gh-pages creates the gh-pages branch on its
        # first run if it doesn't exist yet, and updates it in place after.
        # keep_files: true so this workflow only ever touches its own
        # badges/ directory.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          keep_files: true
          commit_message: >-
            mutation score: ${{ steps.score.outputs.pct }}%
            across ${{ steps.score.outputs.mutants }} mutants
            (${{ steps.score.outputs.killed }} killed /
            ${{ steps.score.outputs.survived }} survived)
