name: Mutation badges

# Mutation-tests the packages that hold pdf2qti's actual conversion/parsing
# logic — everything except internal/itembank, which drives a real Chrome
# instance over CDP and whose correctness depends on live Canvas UI/autosave
# behavior mutation testing can't meaningfully exercise (see its own test
# suite's mocked chromedp `run` field for why: a mutant there mostly proves
# the mock, not the browser interaction).
#
# A full sweep against every package is slow enough that this runs on a
# schedule/manual dispatch, never per-push or per-PR — same reasoning as
# turango's own dogfooding workflow (github.com/jh125486/turango
# .github/workflows/mutation-badge.yml), which this file is adapted from.
on:
  schedule:
    # Weekly. The mutation score changes only when source or tests change,
    # not on a fixed cadence, but a calendar trigger is the simplest way to
    # keep the published badge from silently going stale if nobody happens
    # to run this manually for a while.
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents:write is required to push the generated badge JSON to
    # gh-pages via peaceiris/actions-gh-pages; cannot be downgraded to read.
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install turango
        run: go install github.com/jh125486/turango/cmd/turango@latest

      # Verdicts are cached across scheduled runs, keyed on the hash of
      # every source/test file the run below covers: an unrelated doc-only
      # change still gets a full cache hit next Monday, and a real source
      # edit invalidates only the mutants it affects, not the whole run.
      - name: Restore mutation verdict cache
        uses: actions/cache@v4
        with:
          path: mutation-cache
          key: mutation-cache-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: |
            mutation-cache-

      - name: Run turango against pdf2qti's conversion/parsing packages
        run: |
          mkdir -p mutation-report mutation-cache
          turango test -mutate=. \
            -mutatescope=package \
            -mutateoutput=mutation-report \
            -mutatecache=mutation-cache \
            ./cmd/... \
            ./internal/audit/... \
            ./internal/canvas/... \
            ./internal/config/... \
            ./internal/distill/... \
            ./internal/extract/... \
            ./internal/generate/... \
            ./internal/merge/... \
            ./internal/openai/... \
            ./internal/page/... \
            ./internal/pptx/... \
            ./internal/qti/... \
            ./internal/render/... \
            ./internal/validate/...

      - name: Compute mutation metrics
        id: score
        run: |
          report=mutation-report/mutate-report.json
          mutants=$(jq '.Mutants | length' "$report")
          killed=$(jq '[.Mutants[] | select(.Status=="killed")] | length' "$report")
          survived=$(jq '[.Mutants[] | select(.Status=="survived")] | length' "$report")
          viable=$((killed + survived))

          if [ "$viable" -eq 0 ]; then
            pct="0.0"
          else
            pct=$(awk -v k="$killed" -v v="$viable" 'BEGIN { printf "%.1f", (k / v) * 100 }')
          fi

          # shields.io endpoint-schema color thresholds: red below 50%,
          # yellow from 50% up to (not including) 80%, green at 80%+.
          color=$(awk -v p="$pct" 'BEGIN {
            if (p + 0 >= 80) print "brightgreen";
            else if (p + 0 >= 50) print "yellow";
            else print "red";
          }')

          echo "mutants=$mutants" >> "$GITHUB_OUTPUT"
          echo "killed=$killed" >> "$GITHUB_OUTPUT"
          echo "survived=$survived" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Write shields.io endpoint JSON files
        run: |
          mkdir -p badges
          cat > badges/mutation-score.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutation score",
            "message": "${{ steps.score.outputs.pct }}%",
            "color": "${{ steps.score.outputs.color }}"
          }
          EOF

          cat > badges/mutants-count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutants",
            "message": "${{ steps.score.outputs.mutants }}",
            "color": "blue"
          }
          EOF

      - name: Publish to gh-pages
        # peaceiris/actions-gh-pages creates the gh-pages branch on its
        # first run if it doesn't exist yet, and updates it in place after.
        # keep_files: true so this workflow only ever touches its own
        # badges/ directory.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          keep_files: true
          commit_message: >-
            mutation score: ${{ steps.score.outputs.pct }}%
            across ${{ steps.score.outputs.mutants }} mutants
            (${{ steps.score.outputs.killed }} killed /
            ${{ steps.score.outputs.survived }} survived)
