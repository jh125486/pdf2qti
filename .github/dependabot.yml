version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      all:
        patterns:
          - "*"
  # Build tools live in tools.mod (invoked via `go tool -modfile=tools.mod`). Dependabot's gomod
  # ecosystem only looks for a file literally named go.mod, so it cannot track tools.mod;
  # upgrade it with `task upgrade-tools` instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      all:
        patterns:
          - "*"
